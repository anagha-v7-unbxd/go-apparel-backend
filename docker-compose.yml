# Local development: PostgreSQL + Redis for go-starter
# Usage: docker compose up -d
# Then run the app: make gobuildmac && ./bin/gostarter.bin start
# Apply schema first: psql -h localhost -U your_user -d your_db -f migrations/001_init_catalog.sql

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netcoreunbxd
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unbxd_internship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcoreunbxd -d unbxd_internship"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: {}
